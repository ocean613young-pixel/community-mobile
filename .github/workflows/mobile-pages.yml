name: Deploy mobile study app to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "mobile-site/**"
      - ".github/workflows/mobile-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload mobile site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
